# The project's own, never touched by `limen fix`: the fork's amd64 figures
# on a runner that has AVX-512. GitHub's ubuntu pool mixes hosts with and
# without it, so the recipe stops, naming the host, when the runner lacks
# avx512f; dispatch again. The output is the artifact `bench-amd64`, the
# README's "Benchmarks" section is written from it by hand.
name: bench

on:
  workflow_dispatch:

# No default token permissions: each job states what it needs.
permissions: {}

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      - run: just bench-amd64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-amd64
          path: .build/bench/
          if-no-files-found: error
